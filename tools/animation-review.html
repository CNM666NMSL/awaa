<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><base href="../"><title>贵族动作预览</title>
<style>body{margin:24px;background:#111724;color:#e8ecf8;font:16px system-ui}header{display:flex;align-items:center;gap:18px}h1{font-size:24px}button{padding:8px 18px;cursor:pointer}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}article{background:#202b40;border-radius:12px;overflow:hidden}h2{font-size:15px;margin:14px 18px}canvas{display:block;width:100%;background:repeating-conic-gradient(#253147 0% 25%,#29364c 0% 50%) 0/24px 24px}p{color:#aebdd8}</style>
<header><h1>贵族 · 动作预览</h1><button id="speed">切换慢速</button></header>
<p>每格循环播放对应动作；棋盘格用于检查透明边缘。攻击按游戏中的前摇、命中和收招时间播放。</p><main id="clips"></main>
<script src="js/config.js?v=20261022-noble-v3-final"></script><script src="js/fighter.js?v=20261022-noble-v3-final"></script>
<script>
const rows=[['idle','待机'],['walk','行走'],['j1','直刺'],['j2','横斩'],['j3','上挑'],['u','剑气突刺'],['jump','跳跃'],['block','防御'],['hit','受击'],['low','低身刺'],['airAttack','空中下劈'],['knockdown','倒地'],['getup','起身']];
let slow=false;document.querySelector('#speed').onclick=()=>{slow=!slow;document.querySelector('#speed').textContent=slow?'切换正常速度':'切换慢速'};
const panels=rows.map(([key,label])=>{let article=document.createElement('article');article.innerHTML=`<h2>${label}</h2><canvas width="448" height="240"></canvas>`;document.querySelector('main').append(article);const f=new Fighter('noble',224,1);f.y=216;return {key,f,ctx:article.querySelector('canvas').getContext('2d')};});
let time=0,last=0;
function render(ms){if(ms-last>=(slow?66.66:16.66)){last=ms;time++;for(const {key,f,ctx} of panels){
 const a=f.def.anims[key],count=f._animFrameCount(a);let attack=key==='j1'?f.def.combo[0]:key==='j2'?f.def.combo[1]:key==='j3'?f.def.combo[2]:key==='low'?f.def.low:key==='airAttack'?f.def.airAttack:null;
 f.animKey=key;f.animTimer=time;f.state=key==='walk'?'walk':key==='block'?'block':key==='hit'?'hit':key==='jump'?'jump':key==='knockdown'||key==='getup'?'knockdown':'idle';
 if(attack){f.currentAttack=attack;f.state='attack';const e=f.curEff();f.stateTimer=time%(e.startup+e.active+e.recovery+12);if(f.stateTimer>=e.startup+e.active+e.recovery)f.stateTimer=0;f._updateAnim();}
 else{f.currentAttack=null;f.animFrame=Math.floor(time*(a.fps||12)/60)%(count+3);if(f.animFrame>=count)f.animFrame=count-1;}
 ctx.clearRect(0,0,448,240);ctx.strokeStyle='#64738e';ctx.beginPath();ctx.moveTo(0,217);ctx.lineTo(448,217);ctx.stroke();const img=f._animImg();if(img)f._drawSprite(ctx,img);
 }}requestAnimationFrame(render);}requestAnimationFrame(render);
</script></html>
