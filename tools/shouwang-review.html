<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>AWA · 银铠守望者动作演示</title><style>body{margin:0;background:#101624;color:#ece7db;font:14px 'Microsoft YaHei',sans-serif}main{max-width:1200px;margin:24px auto;padding:0 20px}h1{font-size:27px}p{color:#b7bdca;line-height:1.8}button,a{display:inline-block;padding:9px 14px;margin:3px;border:1px solid #6b6d75;border-radius:5px;background:#252c3b;color:#e8e0ca;text-decoration:none;cursor:pointer}button.active{border-color:#79e4be;color:#a8f5d6;background:#1f423c}canvas{display:block;width:100%;border:1px solid #5a6869;border-radius:8px;image-rendering:pixelated;background:#141c28}#readout{color:#9ee6cc;min-height:23px}.foot{font-size:12px}</style><main><p>AWA / SILVER WARDEN</p><h1>银铠守望者 · 动作与技能</h1><p>重甲稳守，脱甲疾攻。选择招式反复演示，可切换形态、朝向和定格命中姿势。</p><div><a href="index.html">返回游戏</a><button id="form">切换为脱甲形态</button><button id="flip">切换朝向</button><button id="pause">暂停</button><button id="freeze">定格命中</button></div><div id="moves"></div><p id="readout" aria-live="polite"></p><canvas id="demo" width="1200" height="540"></canvas><p class="foot">游戏操作：A / D 移动 · J 三连击 · W + J 上挑 · S + J 破防 · K 二段跳 · L 冲刺 · L + J 突进 · U 剑波 · O 誓约反击 · P 长按攒气 · I 满100气必杀 · S + I 不耗气脱甲（单向）。P2 使用方向键与 1–7。</p></main>
<script src="js/config.js?v=rules-20261024"></script><script src="js/shouwang-anims.js?v=watch2"></script><script src="js/fighter.js?v=rules-20261024"></script><script type="module">
import './js/jianke-fx.js?v=watch1';import './js/shouwang-fx.js?v=watch1';
const canvas=document.getElementById('demo'),ctx=canvas.getContext('2d'),f=new Fighter('shouwang',480,1),g={p1:f,p2:null,phase:'fight',projectiles:[]};let key='super_',form='armored',dir=1,paused=false,clock=0,cast=false,last=performance.now(),acc=0;
const options={idle:'待机',walk:'前进',walkBack:'后退',jump:'跳跃',dash:'冲刺',j1:'J · 横断',j2:'J J · 回锋上挑',j3:'J J J · 裂地重斩',launcher:'W + J · 挑空',low:'S + J · 低扫破防',dashAttack:'L + J · 铁壁突进',airAttack:'空中 J · 坠星重斩',u:'U · 誓约剑波',parry:'O · 誓约招架',parryCounter:'招架成功 · 反斩',charge:'P · 攒气',super_:'I · 终焉裂地',hit:'受击',knockdown:'倒地起身',ko:'战败'};
function start(){window.jiankeFX?.clear();f.resetForRound(480,dir);f.form=form;f.meter=key==='charge'?0:100;g.projectiles=[];cast=false;clock=0;if(key==='u')f.castSkill();else if(key==='super_')f.castSuper();else if(key==='parry')f.castSpecial();else if(key==='charge')f.startCharge();else if(key==='jump')f.jump();else if(key==='dash')f.dash();else if(key==='walk'||key==='walkBack'){f.move(key==='walk'?dir:-dir);f.facing=dir;f.stateTimer=8;}else if(['hit','knockdown','ko'].includes(key)){f.setState(key);f.hitstunLeft=32;f.knockdownTimer=45;}else if(key!=='idle'){if(key==='airAttack'){f.y-=85;f.onGround=false;}f._startAttack(key==='j1'?f.def.combo[0]:key==='j2'?f.def.combo[1]:key==='j3'?f.def.combo[2]:key==='parryCounter'?f.def.special.counter:f.def[key]);}document.querySelectorAll('#moves button').forEach(b=>b.classList.toggle('active',b.dataset.key===key));}
for(const [k,label]of Object.entries(options)){const b=document.createElement('button');b.textContent=label;b.dataset.key=k;b.onclick=()=>{key=k;start()};document.getElementById('moves').append(b)}document.getElementById('form').onclick=()=>{form=form==='armored'?'unarmored':'armored';document.getElementById('form').textContent=form==='armored'?'切换为脱甲形态':'切换为穿甲形态';start()};document.getElementById('flip').onclick=()=>{dir*=-1;start()};document.getElementById('pause').onclick=()=>{paused=!paused;g.phase=paused?'paused':'fight';document.getElementById('pause').textContent=paused?'继续':'暂停'};document.getElementById('freeze').onclick=()=>{start();if(f.currentAttack){f.stateTimer=f.curEff().startup;f._updateAnim();window.shouwangFX.emit(f,f._animForState());}else if(key==='u'){f.stateTimer=f.def.skill.startup;f._updateAnim();window.shouwangFX.emit(f,'u');}paused=true;g.phase='paused';document.getElementById('pause').textContent='继续';};
const bg=new Image();bg.src='assets/stages/industrial-rain.png';function loop(now){acc+=Math.min(80,now-last);last=now;while(acc>=1000/60){if(!paused){f.update();clock++;if(key==='u'&&!cast&&f.state==='skill'&&f.stateTimer>=f.def.skill.startup){g.projectiles.push({x:f.x+dir*50,y:f.y-62,vx:dir*f.def.skill.projSpeed,size:f.def.skill.projSize,owner:f});cast=true;}for(const p of g.projectiles)p.x+=p.vx;g.projectiles=g.projectiles.filter(p=>Math.abs(p.x-f.x)<600);if(clock>130)start();}acc-=1000/60;}ctx.fillStyle='#101624';ctx.fillRect(0,0,1200,540);if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,1200,540);ctx.fillStyle='#08141a66';ctx.fillRect(0,0,1200,540);ctx.save();ctx.translate(600,495);ctx.scale(2.4,2.4);ctx.translate(-f.x,-CONFIG.canvas.groundY);ctx.strokeStyle='#93b9af44';ctx.beginPath();ctx.moveTo(f.x-300,CONFIG.canvas.groundY);ctx.lineTo(f.x+300,CONFIG.canvas.groundY);ctx.stroke();f.draw(ctx);window.jiankeFX?.render(g,ctx);ctx.restore();const a=f.currentAttack?f.curEff():null;document.getElementById('readout').textContent=(form==='armored'?'穿甲 · 减伤20%':'脱甲 · 攻速+10%')+' / '+options[key]+' / 动作帧 '+(f.animFrame+1)+(a?' / 前摇 '+a.startup+' · 判定 '+a.active+' · 收招 '+a.recovery+' 帧':'');requestAnimationFrame(loop)}start();requestAnimationFrame(loop);
</script></html>
