<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWA · 人物动作增帧预览</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101919;color:#e8dfc7;font:15px 'Microsoft YaHei',sans-serif}header{padding:22px 28px;border-bottom:1px solid #445548}h1{font:25px Georgia,serif;margin:0 0 9px}p{margin:8px 0;color:#b8c4b7}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}select,button,a{font:inherit;background:#25382f;color:#f4e8c9;border:1px solid #697d63;padding:10px 15px;border-radius:4px}a{text-decoration:none}main{padding:22px 28px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{border:1px solid #465a4b;border-radius:6px;overflow:hidden;background:#192723}h2{font-size:17px;margin:16px 18px 5px}.status{margin:0 18px 10px;color:#b8c4b7}canvas{display:block;width:100%;image-rendering:pixelated;background:linear-gradient(#182427,#1e302a)}#message{min-height:26px;margin-bottom:15px;color:#d1bd88}#strip{display:none;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px}#strip.show{display:grid}.cell{background:#22332c;border:1px solid #526149;padding:8px}.cell img{width:100%;height:110px;object-fit:contain;image-rendering:pixelated}.cell small{color:#d9cbb0}@media(max-width:700px){.panels{grid-template-columns:1fr}header,main{padding:16px}#strip{grid-template-columns:repeat(3,1fr)}}
</style>
<header><h1>AWA · 人物动作增帧预览</h1><p>原动作与补绘版本对照 · 基础 10 帧 / 技能、防御、聚气 12 帧 / 大招 25 帧</p>
<div class="controls"><select id="role" aria-label="人物"><option value="noble">贵族决斗者</option><option value="jianke">江湖剑客</option><option value="armored">守望者 · 穿甲</option><option value="unarmored">守望者 · 脱甲</option></select><select id="action" aria-label="动作"></select><button id="toggle">暂停</button><button id="step">逐帧</button><button id="restart">重播</button><button id="all">显示全部帧</button><a href="../index.html">进入游戏</a></div></header>
<main><div id="message">正在加载动作…</div><div class="panels"><section class="panel"><h2>原动作（对照）</h2><div class="status" id="old-status"></div><canvas id="old" width="620" height="390"></canvas></section><section class="panel"><h2>当前实战动作</h2><div class="status" id="new-status"></div><canvas id="new" width="620" height="390"></canvas></section></div><div id="strip"></div></main>
<p style="padding:0 28px">新版走路 / 后退 24 FPS，跑步 32 FPS。蓄力起手仅播放一遍，随后保持最后姿势；实战中最多蓄力 7 秒。</p>
<script src="../js/config.js?v=gait3"></script><script src="../js/jianke-anims.js"></script><script src="../js/jianke-movement.js"></script><script src="../js/jianke-walk.js"></script><script src="../js/shouwang-anims.js"></script><script src="../js/mobility-anims.js"></script><script src="../js/combat-v2-config.js"></script>
<script>const before=JSON.parse(JSON.stringify(CONFIG.characters));</script><script src="../js/expanded-anims.js?v=frames1"></script><script src="../js/gait-v2.js?v=idle1"></script>
<script>
const $=id=>document.getElementById(id),names={idle:'待机',walk:'移动',walkBack:'后退',run:'奔跑',jump:'跳跃',doubleJump:'二段跳',airMove:'空中移动',dash:'瞬身',j1:'普攻一段',j2:'普攻二段',j3:'普攻三段',j4:'普攻四段',launcher:'上挑',low:'下攻',dashAttack:'突进普攻',airAttack:'空中普攻',block:'防御',parry:'招架',charge:'聚气 P',uCharge:'蓄力 U',u:'释放剑气 U',uCharged:'蓄力剑气',superLunge:'突进技能',superWave:'剑气技能',super_:'大招'};
let active=[],tick=0,paused=false,last=0,token=0;
function frameCount(a){return Array.isArray(a.frames)?a.frames[1]-a.frames[0]+1:typeof a.frames==='object'?a.frames.count:a.frames;}
function offset(a){return Array.isArray(a.frames)?a.frames[0]:typeof a.frames==='object'?a.frames.offset||0:0;}
async function setup(){const own=++token,identity=$('role').value,id=['armored','unarmored'].includes(identity)?'shouwang':identity,form=id==='shouwang'?identity:'',key=$('action').value;tick=0;const result=[];
 for(const [label,defs]of [['old',before],['new',CONFIG.characters]]){const a=defs[id].anims[key]||(key==="walkBack"?defs[id].anims.walk:null),n=frameCount(a),images=[];for(let i=0;i<n;i++){const im=new Image();im.src='../'+a.path.replace('{form}',form)+'/'+String(i+offset(a)).padStart(2,'0')+'.png?v='+ASSET_VER;images.push(im);}await Promise.all(images.map(im=>new Promise(resolve=>{if(im.complete)return resolve();im.onload=im.onerror=resolve;})));const attack=key==='super_'?defs[id].super_:null;const phases=attack?[attack.startup,attack.active,attack.recovery]:null;result.push({label,a,n,images,phases,duration:phases?phases.reduce((x,y)=>x+y,0):n*60/a.fps});}
 if(own!==token)return;active=result;const bad=result.flatMap(r=>r.images.filter(i=>!i.naturalWidth));$('message').textContent=bad.length?'有 '+bad.length+' 张图片未加载，请检查素材。':`${names[key]||key}：${result[0].n} → ${result[1].n} 帧${key==='super_'?' · 大招 '+(result[0].duration/60).toFixed(2)+' → '+(result[1].duration/60).toFixed(2)+' 秒（不含开场定格）':''}`;
 $('strip').replaceChildren(...result[1].images.map((im,i)=>{const box=document.createElement('div'),tag=document.createElement('small');box.className='cell';tag.textContent='第 '+(i+1)+' / '+result[1].n+' 帧';box.append(im.cloneNode(),tag);return box;}));render();}
function selectRole(){const identity=$('role').value,id=['armored','unarmored'].includes(identity)?'shouwang':identity,old=$('action').value;$('action').replaceChildren(...Object.entries(names).filter(([k])=>CONFIG.characters[id].anims[k]).map(([k,n])=>{const o=document.createElement('option');o.value=k;o.textContent=n;return o;}));$('action').value=CONFIG.characters[id].anims[old]?old:'run';setup();}
function index(r){const hold=['charge','uCharge'].includes($('action').value)&&r.label==='new',t=hold?Math.min(tick,r.duration-1):tick%Math.ceil(r.duration);if(r.phases&&r.a.phases){const [s,a,z]=r.phases,[c,b]=r.a.phases;return t<s?Math.min(c-1,Math.floor(t*c/s)):t<s+a?c+Math.min(b-c-1,Math.floor((t-s)*(b-c)/a)):b+Math.min(r.n-b-1,Math.floor((t-s-a)*(r.n-b)/z));}return Math.min(r.n-1,Math.floor(t*r.a.fps/60));}
function render(){for(const r of active){const canvas=$(r.label),ctx=canvas.getContext('2d'),i=index(r),im=r.images[i];ctx.clearRect(0,0,620,390);ctx.fillStyle='#293d30';ctx.fillRect(0,326,620,64);ctx.strokeStyle='#80916a';ctx.beginPath();ctx.moveTo(0,326);ctx.lineTo(620,326);ctx.stroke();if(im?.naturalWidth){const height=230*(r.a.canvasHeight||im.height)/(r.a.referenceHeight||im.height),width=height*im.width/im.height,x=260-width*(r.a.originX??.5),y=326-height*(r.a.originY??.94);ctx.drawImage(im,x,y,width,height);}$(r.label+'-status').textContent=r.n+' 帧 · '+r.a.fps+' FPS · 当前第 '+(i+1)+' 帧';}}
$('role').onchange=selectRole;$('action').onchange=setup;$('toggle').onclick=()=>{paused=!paused;$('toggle').textContent=paused?'播放':'暂停';};$('step').onclick=()=>{paused=true;$('toggle').textContent='播放';const r=active[1];if(r){const now=index(r);for(let j=0;j<Math.ceil(r.duration);j++){tick++;if(index(r)!==now)break;}}render();};$('restart').onclick=()=>{tick=0;render();};$('all').onclick=()=>{$('strip').classList.toggle('show');};function loop(now){if(!last)last=now;if(!paused&&now-last>=1000/60){tick+=Math.min(6,Math.floor((now-last)*60/1000));last=now;render();}if(paused)last=now;requestAnimationFrame(loop);}selectRole();requestAnimationFrame(loop);
</script></html>
