<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWA · 新动作组 V2</title><style>body{margin:0;background:#111c1c;color:#e5d6ad;font:15px Microsoft YaHei}header{padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}select,button,a{color:#e5d6ad;background:#20322c;border:1px solid #929277;padding:9px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px}article{border:1px solid #727963;background:radial-gradient(ellipse at 50% 60%,#365347,#14221f);padding:12px}h3{margin:0;font-size:17px}canvas{width:100%;max-height:245px;object-fit:contain;image-rendering:pixelated}p{margin:10px 16px;font-size:13px;line-height:1.8}article p{margin:0} @media(max-width:600px){main{grid-template-columns:1fr}}</style><header><b>三角色新动作组</b><select id="clip"><option value="u">重新制作 · 普通远攻</option><option value="j4" selected>新增 · 第四段普攻</option><option value="uCharged">新增 · 蓄力远攻释放</option><option value="uCharge">新增 · 远攻蓄力姿势</option></select><button id="pause">定格</button><button id="next">下一帧</button><a href="index.html?v=combat3">进入游戏</a></header><main id="cards"></main><p>U / 4 短按远攻，长按至少0.5秒后松开发射蓄力弹；空中也可释放。J / 1 可接四段。O / 6 需要攒满角色专属资源。</p><script>
const forms=[['noble','贵族决斗者'],['jianke','江湖剑客'],['armored','银铠守望者 · 穿甲'],['unarmored','银铠守望者 · 脱甲']],counts={u:6,j4:7,uCharged:7,uCharge:4};let paused=false,frame=0,last=0;const cards=[];
for(const [id,name]of forms){const card=document.createElement('article');card.innerHTML='<h3>'+name+'</h3><canvas width="512" height="320"></canvas><p></p>';document.getElementById('cards').append(card);cards.push({id,ctx:card.querySelector('canvas').getContext('2d'),text:card.querySelector('p'),images:{}});}
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'播放':'定格';};document.getElementById('next').onclick=()=>{paused=true;frame++;document.getElementById('pause').textContent='播放';};document.getElementById('clip').onchange=()=>frame=0;
function draw(now){if(!paused&&now-last>1000/12){frame++;last=now;}const clip=document.getElementById('clip').value,n=frame%counts[clip];for(const c of cards){const key=clip+n;if(!c.images[key]){const im=new Image();im.src='assets/chars/combat-v2/'+c.id+'/'+clip+'/'+String(n).padStart(2,'0')+'.png';c.images[key]=im;}c.ctx.clearRect(0,0,512,320);c.ctx.strokeStyle='#899c7870';c.ctx.beginPath();c.ctx.moveTo(30,301);c.ctx.lineTo(482,301);c.ctx.stroke();const im=c.images[key];if(im.complete&&im.naturalWidth)c.ctx.drawImage(im,0,0);c.text.textContent=clip+' · '+(n+1)+' / '+counts[clip];}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
