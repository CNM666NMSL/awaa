<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="../"><title>剑客动作与参数校对</title><style>body{background:#171b28;color:#e8e1d0;font:16px system-ui;margin:28px}header{position:sticky;top:0;background:#171b28;padding:12px;z-index:1}a{color:#e4be75}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}article{background:#242938;border:1px solid #505469;padding:12px;border-radius:8px}img{width:100%;image-rendering:pixelated;background:linear-gradient(transparent 90.4%,#667080 90.6%,transparent 91%)}table{border-collapse:collapse;width:100%;margin-top:24px}td,th{padding:9px;border-bottom:1px solid #555;text-align:left}button,input{margin:10px}small{color:#b9bdc9}</style><header><h1>江湖剑客 · 动作校对 V2</h1><a href="index.html">返回游戏</a><button id="pause">暂停动画</button><button id="flip">切换朝向</button><button id="step">走路逐帧</button><label>播放速度 <input id="speed" type="range" min="0.1" max="2" step="0.1" value="1"></label><p>27 个动作状态 / 52 个源姿势。攻击按前摇、判定、后摇分段播放；可暂停检查。双方基础血量 2000。</p></header><main id="grid"></main><h2>战斗参数（60 帧/秒）</h2><table><thead><tr><th>招式</th><th>伤害</th><th>前摇</th><th>判定</th><th>后摇</th><th>射程</th><th>耗气</th></tr></thead><tbody id="moves"></tbody></table><script src="js/config.js?v=rules-20261024"></script><script src="js/jianke-anims.js?v=walk-fix2"></script><script src="js/jianke-movement.js?v=walk-fix2"></script><script src="js/jianke-walk.js?v=walk3"></script><script>
const d=CONFIG.characters.jianke,names={idle:'待机',walk:'前进',walkBack:'后退',walkStart:'起步',walkStop:'停步',j1:'一式·横斩',j2:'二式·回锋',j3:'三式·断流',launcher:'挑空',low:'低扫',dashAttack:'踏影刺',airAttack:'落雁斩',super_:'终式',superLunge:'疾影突',superWave:'裂空波',u:'剑气',jump:'跳跃',land:'落地',dash:'瞬步',block:'防御',parry:'架剑',charge:'蓄气',hit:'受击',fall:'击飞',knockdown:'倒地',ko:'败北',getup:'起身'};
const attacks={j1:d.combo[0],j2:d.combo[1],j3:d.combo[2],launcher:d.launcher,low:d.low,dashAttack:d.dashAttack,airAttack:d.airAttack,super_:d.super_,superLunge:d.superTiers.lunge};
names.nobleWalk='贵族决斗者 · 走路参考'; const onlyWalk=new URL(location.href).searchParams.get('view')==='walk'; const cards=[...Object.entries(d.anims),['nobleWalk',CONFIG.characters.noble.anims.walk]].filter(([key])=>!onlyWalk||['walk','walkBack','walkStart','walkStop','nobleWalk'].includes(key)).map(([key,a])=>{const card=document.createElement('article');card.innerHTML='<b>'+names[key]+'</b><img alt="'+names[key]+'"><small></small>';document.getElementById('grid').append(card);return {key,a,img:card.querySelector('img'),label:card.querySelector('small')};});
let manualWalkFrame=null;document.getElementById("step").onclick=()=>{paused=true;manualWalkFrame=((manualWalkFrame??-1)+1)%d.anims.walk.frames;};let paused=false,dir=1,t=0,last=performance.now();document.getElementById('pause').onclick=e=>{paused=!paused;manualWalkFrame=null;e.target.textContent=paused?'继续播放':'暂停动画'};document.getElementById('flip').onclick=()=>{dir=-dir;cards.forEach(c=>c.img.style.transform='scaleX('+dir+')')};
function draw(now){if(!paused)t+=(now-last)/1000*Number(document.getElementById('speed').value);last=now;for(const c of cards){const {a,key}=c;let frame=Math.floor(t*a.fps)%a.frames;const hit=attacks[key];if(hit&&a.phases){const tick=Math.floor(t*60)%(hit.startup+hit.active+hit.recovery+18),[contact,recover]=a.phases;frame=tick<hit.startup?Math.floor(tick*contact/hit.startup):tick<hit.startup+hit.active?contact+Math.floor((tick-hit.startup)*(recover-contact)/hit.active):Math.min(a.frames-1,recover+Math.floor((tick-hit.startup-hit.active)*(a.frames-recover)/hit.recovery));}if(manualWalkFrame!==null&&['walk','nobleWalk'].includes(key))frame=manualWalkFrame%a.frames;const src=a.path+'/'+String(frame).padStart(2,'0')+'.png?v=walk-fix2';if(c.img.getAttribute('src')!==src)c.img.src=src;c.label.textContent=key+' · '+(frame+1)+' / '+a.frames;}requestAnimationFrame(draw)}requestAnimationFrame(draw);
for(const [key,a] of Object.entries({...attacks,u:d.skill,superWave:d.superTiers.wave})){const row=document.createElement('tr');row.innerHTML=[names[key],a.damage,a.startup,a.active??'飞行',a.recovery,a.range??'飞行',key==='super_'?100:key==='superLunge'||key==='superWave'?'练习招式':a.cost??0].map(v=>'<td>'+v+'</td>').join('');document.getElementById('moves').append(row)}
</script></html>
