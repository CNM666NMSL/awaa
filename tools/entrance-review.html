<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>AWA · 三秒进场动画</title><style>body{margin:0;background:#101624;color:#eee5d6;font:14px 'Microsoft YaHei',sans-serif}main{max-width:1240px;padding:24px;margin:auto}h1{font-size:26px}p{color:#aeb9c8;line-height:1.8}a{color:#e7c17f}button,select{padding:8px 12px;margin:3px;color:#e8e2d6;background:#263244;border:1px solid #6a7584;border-radius:4px;font:inherit;cursor:pointer}canvas{display:block;width:100%;image-rendering:pixelated;border:1px solid #56616c;border-radius:8px;margin:15px 0}#timeline{width:min(550px,70%);vertical-align:middle}#status{color:#e4c18c}label{display:inline-block;margin-right:8px}.bar{display:flex;flex-wrap:wrap;align-items:center}</style><main><p>AWA / ROUND INTRODUCTION</p><h1>三秒进场 · 角色登场与回合开始</h1><p>贵族：踏步与持剑礼；剑客：踏影与回锋；守望者：重步落地与誓约立剑。进场序列包含「第一回合」与「比赛开始」，正式比赛在第3秒解除操作锁定。</p><div class="bar"><label>P1 <select id="left"><option value="noble">贵族决斗者</option><option value="jianke">江湖剑客</option><option value="armored">守望者 · 穿甲</option><option value="unarmored">守望者 · 脱甲</option></select></label><label>P2 <select id="right"><option value="jianke">江湖剑客</option><option value="noble">贵族决斗者</option><option value="armored">守望者 · 穿甲</option><option value="unarmored">守望者 · 脱甲</option></select></label><button id="replay">重新播放三秒进场</button><button id="pause">暂停</button><button id="round">定格第一回合</button><button id="fight">定格比赛开始</button></div><p><input id="timeline" type="range" min="0" max="3600" value="0" step="10" aria-label="进场时间"><span id="status" aria-live="polite"></span></p><canvas id="demo" width="1200" height="540"></canvas><p><a href="tools/dusk-ui-options.html">比较三组黄昏按钮方案 →</a>　<a href="index.html">返回游戏</a></p></main><script src="js/config.js?v=entrance2"></script><script src="js/jianke-anims.js"></script><script src="js/jianke-movement.js"></script><script src="js/jianke-walk.js"></script><script src="js/shouwang-anims.js"></script><script src="js/mobility-anims.js"></script><script src="js/fighter.js?v=rules-20261024-b"></script><script src="js/round-entrance.js?v=theme-c1"></script><script type="module">
import './js/jianke-fx.js?v=entrance2';import './js/shouwang-fx.js?v=mobility1';
const ctx=document.getElementById('demo').getContext('2d'),g={mode:'local',phase:'intro',phaseTimer:0,projectiles:[]},entry=window.roundEntrance,bg=new Image();bg.src='assets/stages/industrial-rain.png';let ms=0,paused=false,last=performance.now();function fighter(id,x,d){const f=new Fighter(['armored','unarmored'].includes(id)?'shouwang':id,x,d);if(f.charId==='shouwang')f.form=id;return f;}function start(){g.p1=fighter(document.getElementById('left').value,360,1);g.p2=fighter(document.getElementById('right').value,840,-1);ms=0;paused=false;last=performance.now();document.getElementById('pause').textContent='暂停';window.jiankeFX?.clear();}document.getElementById('left').onchange=start;document.getElementById('right').onchange=start;document.getElementById('replay').onclick=start;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'继续':'暂停'};function freeze(time){ms=time;paused=true;document.getElementById('pause').textContent='继续';}document.getElementById('round').onclick=()=>freeze(2100);document.getElementById('fight').onclick=()=>freeze(3250);document.getElementById('timeline').oninput=e=>freeze(Number(e.target.value));function loop(now){if(!paused)ms=Math.min(3600,ms+Math.min(100,now-last));last=now;g.phaseTimer=Math.min(180,Math.floor(ms*.06));g.phase=ms<3000?'intro':'fight';g._fightBannerStartedAt=performance.now()-Math.max(0,ms-3000);ctx.fillStyle='#152032';ctx.fillRect(0,0,1200,540);if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,1200,540);ctx.fillStyle='#0b17222a';ctx.fillRect(0,0,1200,540);for(const f of [g.p1,g.p2]){ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(f.x,460,38,8,0,0,Math.PI*2);ctx.fill();if(g.phase==='intro')entry.actor(ctx,f,g.phaseTimer);else f.draw(ctx);}window.jiankeFX?.render(g,ctx);if(ms<3600)entry.overlay(ctx,g);document.getElementById('timeline').value=ms;document.getElementById('status').textContent=(ms/1000).toFixed(2)+' 秒 · '+(ms>=3600?'比赛进行中':ms>=3000?'三秒进场结束，比赛开始':ms>=1567?'第一回合':'角色进场');requestAnimationFrame(loop)}start();requestAnimationFrame(loop);
</script></html>
