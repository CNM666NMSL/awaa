<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWA · 瞬身特效预览</title><style>body{margin:0;background:#111c1c;color:#e5d6ad;font:16px 'Microsoft YaHei',sans-serif}header{padding:16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}button,a{background:#20322c;color:#e5d6ad;border:1px solid #929277;padding:10px;text-decoration:none}canvas{width:100%;display:block}p{margin:10px 16px;font-size:13px}</style><header><b>瞬身 · 三角色特效预览</b><button id="replay">重播瞬身</button><label><input type="checkbox" id="freeze" checked>定格特效</label><a href="../index.html">返回游戏</a></header><canvas id="preview" width="1200" height="540"></canvas><p>150 像素立即位移 · 前 8 帧无敌 · 40 帧冷却 · L / 3 / 手机「瞬身」</p><script src="../js/config.js?v=blink1"></script><script src="../js/jianke-anims.js"></script><script src="../js/jianke-movement.js"></script><script src="../js/jianke-walk.js"></script><script src="../js/shouwang-anims.js"></script><script src="../js/mobility-anims.js"></script><script src="../js/fighter.js?v=blink1"></script><script src="../js/blink-fx.js?v=blink1"></script><script type="module" src="../js/jianke-fx.js?v=entrance2"></script><script>
