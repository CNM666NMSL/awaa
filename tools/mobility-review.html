<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>AWA · 全角色移动与空中追击</title><style>body{margin:0;background:#111827;color:#eee7d7;font:14px 'Microsoft YaHei',sans-serif}main{max-width:1200px;padding:20px;margin:auto}h1{font-size:25px;margin:10px 0}p{color:#afbbcb;line-height:1.8}button,select,a{padding:8px 12px;margin:3px;border:1px solid #697587;border-radius:5px;color:#eee7d7;background:#273346;font:inherit;text-decoration:none;cursor:pointer}button.active{color:#b5f4da;background:#25483d;border-color:#93ccb3}canvas{width:100%;display:block;border:1px solid #52616d;border-radius:8px;image-rendering:pixelated}#status{color:#abddc5}#frames{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#frames figure{margin:0;background:#202b3d;text-align:center;border:1px solid #445163;border-radius:6px}#frames img{width:100%;height:135px;object-fit:contain;image-rendering:pixelated}figcaption{font-size:11px;padding:5px;color:#b8c0cc}summary{padding:12px;cursor:pointer;color:#dec58c}</style><main><p>AWA / MOVEMENT</p><h1>全角色 · 快跑、方向二段跳与空中追击</h1><p>游戏操作：双击 A/D 或 ←/→ 后按住第二次进入快跑；K / 2 跳跃，空中再次按可二段跳；方向键控制空中移动，J / 1 空中追击。W+J / ↑+1 上挑，W / ↑ 单按不跳。</p><div><a href="index.html?practice=select">进入练习场</a><select id="character" aria-label="选择演示角色"><option value="noble">贵族决斗者</option><option value="jianke">江湖剑客</option><option value="armored">银铠守望者 · 穿甲</option><option value="unarmored">银铠守望者 · 脱甲</option></select><button id="flip">切换朝向</button><button id="pause">暂停</button><button id="step">前进一帧</button><button id="freeze">定格关键动作</button></div><div id="actions"></div><p id="status" aria-live="polite"></p><canvas id="demo" width="1200" height="500"></canvas><details><summary>查看所选动作组关键帧</summary><div id="frames"></div></details></main><script src="js/config.js"></script><script src="js/jianke-anims.js"></script><script src="js/jianke-movement.js"></script><script src="js/jianke-walk.js"></script><script src="js/shouwang-anims.js"></script><script src="js/mobility-anims.js?v=mobility1"></script><script src="js/fighter.js?v=mobility1"></script><script type="module">
import './js/jianke-fx.js?v=mobility1';import './js/shouwang-fx.js?v=mobility1';
const ctx=document.getElementById('demo').getContext('2d'),g={phase:'fight',p1:null,p2:null,projectiles:[]},labels={run:'双击方向 · 快跑',doubleJump:'方向二段跳',airMove:'空中左右移动',airAttack:'空中移动 + 普攻',combo:'快跑 → 二段跳 → 空中追击'};let travel=0;let id='noble',kind='run',dir=1,f,clock=0,paused=false,last=performance.now(),acc=0;
function make(){const char=['armored','unarmored'].includes(id)?'shouwang':id;f=new Fighter(char,450,dir);if(char==='shouwang')f.form=id;g.p1=f;g.phase=paused?'paused':'fight';g.projectiles=[];clock=0;window.jiankeFX?.clear();if(kind!=='run'&&kind!=='combo')f.jump(dir);refreshFrames();}
function refreshFrames(){const clip=f.def.anims[kind==='combo'?'airAttack':kind],path=clip.path.replace('{form}',id);document.getElementById('frames').innerHTML=Array.from({length:clip.frames},(_,i)=>'<figure><img src="'+path+'/'+String(i).padStart(2,'0')+'.png" alt="'+labels[kind]+'关键帧'+(i+1)+'"><figcaption>'+(i+1)+' / '+clip.frames+'</figcaption></figure>').join('');document.querySelectorAll('#actions button').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));}
function tick(){clock++;if(kind==='run'){f.move(dir,true);}else if(kind==='combo'){if(clock<22)f.move(dir,true);if(clock===22)f.jump(dir);if(clock===37)f.jump(dir);if(clock===52)f.attack();if(!f.onGround)f.move(dir);}else{if(clock===16&&kind!=='airMove')f.jump(dir);if(kind==='airAttack'&&clock===28)f.attack();f.move(clock<45?dir:-dir);}const oldX=f.x;f.update();travel=f.x-oldX;if(clock>125||f.x<170||f.x>1030)make();}
for(const [key,label]of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.dataset.kind=key;b.onclick=()=>{kind=key;make()};document.getElementById('actions').append(b)}document.getElementById('character').onchange=e=>{id=e.target.value;make()};document.getElementById('flip').onclick=()=>{dir*=-1;make()};document.getElementById('pause').onclick=()=>{paused=!paused;g.phase=paused?'paused':'fight';document.getElementById('pause').textContent=paused?'继续':'暂停'};document.getElementById('step').onclick=()=>{paused=true;g.phase='paused';document.getElementById('pause').textContent='继续';tick()};document.getElementById('freeze').onclick=()=>{make();const end=kind==='run'?8:kind==='combo'?59:kind==='airAttack'?36:22;for(let i=0;i<end;i++)tick();paused=true;g.phase='paused';document.getElementById('pause').textContent='继续';if(f.currentAttack)window.jiankeFX?.actor(f);};
const bg=new Image();bg.src='assets/stages/industrial-rain.png';function loop(now){acc+=Math.min(80,now-last);last=now;while(acc>=1000/60){if(!paused)tick();acc-=1000/60;}ctx.fillStyle='#152032';ctx.fillRect(0,0,1200,500);if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,1200,500);ctx.fillStyle='#10182766';ctx.fillRect(0,0,1200,500);ctx.save();ctx.translate(600,450);ctx.scale(2.1,2.1);ctx.translate(-f.x,-Math.min(CONFIG.canvas.groundY,f.y+90));ctx.strokeStyle='#b6bfa94d';ctx.beginPath();for(let x=0;x<1600;x+=40){ctx.moveTo(x,CONFIG.canvas.groundY);ctx.lineTo(x+18,CONFIG.canvas.groundY);}ctx.stroke();f.draw(ctx);window.jiankeFX?.render(g,ctx);ctx.restore();document.getElementById('status').textContent=f.name+' / '+labels[kind]+' / '+f.animKey+' '+(f.animFrame+1)+'帧 / 剩余跳跃 '+f.jumpsLeft+' / 水平速度 '+travel.toFixed(2);requestAnimationFrame(loop)}make();requestAnimationFrame(loop);
</script></html>
