<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWA · 三角色魔法特效</title><style>body{margin:0;background:#111c1c;color:#e5d6ad;font:15px Microsoft YaHei}header{display:flex;gap:12px;padding:14px;align-items:center;flex-wrap:wrap}button,select,a{background:#20322c;color:#e5d6ad;border:1px solid #929277;padding:9px}canvas{width:100%;display:block}p{margin:12px}</style><header><b>三角色 · 战斗特效</b><select id="role"><option value="noble">贵族 · 七星芒阵</option><option value="jianke">剑客 · 水波大剑</option><option value="shouwang">守望者 · 圣印魔法</option></select><select id="kind"><option value="super">大招</option><option value="skill">技能</option><option value="charge">攒气</option></select><button id="replay">预览特效</button><label><input id="freeze" type="checkbox" checked> 定格</label><a href="index.html?v=magic1">进入游戏</a></header><canvas id="view" width="1200" height="540"></canvas><p id="caption"></p><script src="js/config.js?v=arcade1"></script><script src="js/jianke-anims.js"></script><script src="js/jianke-movement.js"></script><script src="js/jianke-walk.js"></script><script src="js/shouwang-anims.js"></script><script src="js/mobility-anims.js"></script><script src="js/fighter.js?v=arcade1"></script><script type="module" src="js/character-magic.js?v=magic1"></script><script type="module" src="js/jianke-fx.js?v=arcade1"></script><script>
const ctx=document.getElementById('view').getContext('2d'),image=new Image();image.src='assets/stages/industrial-rain.png';let fighter,mode,ready=false;const fake={phase:'paused',projectiles:[]};
function replay(){const fx=window.jiankeFX,magic=window.characterMagic;if(!fx||!magic)return;fx.clear();fx.maxEvents=240;fighter=new Fighter(document.getElementById('role').value,530,1);mode=document.getElementById('kind').value;fighter.meter=100;if(mode==='super'){fighter.castSuperTier();fighter.stateTimer=fighter.def.super_.startup;}else if(mode==='skill'){fighter.castSkill();fighter.stateTimer=10;}else{fighter.startCharge();fighter.stateTimer=20;}fighter._updateAnim();magic.emit(fx,fighter,mode);document.getElementById('caption').textContent={noble:'西式七星芒阵：七点连线、同心环、七颗星光节点。',jianke:'东方剑意：大剑形剑光、银蓝斩击、贴地涟漪与水滴。',shouwang:'西式守护魔法：盾形圣印、环形结界、十字裁决光柱。'}[fighter.charId];ready=true;}
document.getElementById('replay').onclick=replay;document.getElementById('role').onchange=replay;document.getElementById('kind').onchange=replay;
function draw(){ctx.fillStyle='#111c1c';ctx.fillRect(0,0,1200,540);if(image.complete&&image.naturalWidth)ctx.drawImage(image,0,0,1200,540);ctx.fillStyle='#111c1c88';ctx.fillRect(0,0,1200,540);if(!ready)replay();if(fighter){fighter.draw(ctx);fake.phase=document.getElementById('freeze').checked?'paused':'fight';window.jiankeFX?.render(fake,ctx);}requestAnimationFrame(draw);}draw();
</script></html>
