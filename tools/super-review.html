<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWA · 大招演出预览</title><style>body{margin:0;background:#111c1c;color:#e5d6ad;font:14px Microsoft YaHei}header{padding:12px;display:flex;gap:12px;align-items:center}button,select,a{padding:8px;background:#20322c;color:#e5d6ad;border:1px solid #929277}iframe{border:0;width:100%;height:calc(100vh - 65px)}</style><header><b>大招时停与定格演出</b><select id="role"><option value="noble">贵族决斗者</option><option value="jianke">江湖剑客</option><option value="shouwang">银铠守望者</option></select><button id="still">定格预览</button><button id="play">播放演出</button><a href="../index.html">进入游戏</a></header><iframe id="game" src="../index.html?practice=noble"></iframe><script>
function cast(still){const w=document.getElementById('game').contentWindow,g=w.game;if(!g)return;g.startNoblePractice(document.getElementById('role').value,'jianke');g.p1.meter=100;g.p1.castSuperTier();g.beginSuperCinematic();if(still){g.superFreeze.left=18;g.phase='paused';}}
document.getElementById('game').onload=()=>{const d=document.getElementById('game').contentDocument,style=d.createElement('style');style.textContent='#hud,#quick-settings,#noble-practice,.touch-controls{display:none!important}#game-wrapper{min-height:0!important}body{overflow:hidden}';d.head.append(style);};
document.getElementById('still').onclick=()=>cast(true);document.getElementById('play').onclick=()=>cast(false);
</script></html>
