<!doctype html><html lang="zh"><meta charset="utf-8"><base href="../"><title>剑客 Three.js 特效校对</title><style>body{background:#101b30;color:#eceaf8;font:16px system-ui;margin:24px}button{padding:9px;margin:4px;background:#2b3552;color:white;border:1px solid #84839b;border-radius:4px}canvas{width:100%;max-width:1200px;border:1px solid #5e647d;image-rendering:pixelated}a{color:#bcbfff}</style><h1>剑客 · Three.js 特效校对</h1><p>银白剑弧 / 紫灰拖尾 / 尘土碎石。选择动作可反复播放，切换朝向检查左右镜像。</p><p><a href="index.html">返回游戏</a> <button id="flip">切换朝向</button><button id="pause">暂停</button><button id="freeze">定格命中</button></p><div id="buttons"></div><p id="label"></p><canvas id="demo" width="1200" height="540"></canvas><script src="js/config.js"></script><script src="js/jianke-anims.js"></script><script src="js/jianke-movement.js?v=move1"></script><script src="js/jianke-walk.js?v=walk3"></script><script src="js/fighter.js"></script><script type="module">
import {JiankeFX} from './js/jianke-fx.js?v=fx2';
const fx=window.jiankeFX,canvas=document.getElementById('demo'),ctx=canvas.getContext('2d');const f=new Fighter('jianke',430,1),other=new Fighter('noble',850,-1);let key='super_',paused=false,clock=0;const g={p1:f,p2:other,phase:'fight',projectiles:[]};
const options={j1:'横斩',j2:'回锋',j3:'重斩',launcher:'挑空',low:'低扫',dashAttack:'冲刺攻击',airAttack:'空中斩',u:'剑气',super_:'满气大招',charge:'攒气',block:'防御',hit:'受击',knockdown:'倒地',ko:'战败',jump:'跳跃',dash:'冲刺'};
function start(){fx.clear();f.resetForRound(f.facing===1?430:770,f.facing);f.meter=100;g.projectiles=[];if(key==='u'){const s=f.castSkill();g.projectiles.push({x:f.x+f.facing*60,y:f.y-60,size:14,vx:f.facing*10,owner:f});}else if(key==='charge')f.startCharge();else if(key==='jump')f.jump();else if(key==='dash')f.dash();else if(['block','hit','knockdown','ko'].includes(key)){f.setState(key);f.hitstunLeft=30;f.knockdownTimer=40;}else{const a=key==='j1'?f.def.combo[0]:key==='j2'?f.def.combo[1]:key==='j3'?f.def.combo[2]:f.def[key];f._startAttack(a);}document.getElementById('label').textContent=options[key];clock=0;}
for(const [k,name]of Object.entries(options)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{key=k;start()};document.getElementById('buttons').append(b)}document.getElementById('flip').onclick=()=>{f.facing*=-1;start()};document.getElementById('pause').onclick=()=>{paused=!paused;g.phase=paused?'paused':'fight'};
document.getElementById("freeze").onclick=()=>{start();paused=true;g.phase="paused";if(f.currentAttack){f.stateTimer=f.curEff().startup;f._updateAnim();}fx.emit(f,key);};
let last=performance.now(),acc=0;function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){if(!paused){f.update();clock++;for(const p of g.projectiles)p.x+=p.vx;if(clock>110)start();}acc-=1000/60;}ctx.fillStyle='#101b30';ctx.fillRect(0,0,1200,540);ctx.strokeStyle='#5c627c';ctx.beginPath();ctx.moveTo(0,460);ctx.lineTo(1200,460);ctx.stroke();f.draw(ctx);fx.render(g,ctx);requestAnimationFrame(loop)}start();requestAnimationFrame(loop);
</script></html>
